name: Daily Closure & AI Learning (24/7)
on:
  schedule:
    - cron: "10 0 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: daily-closure
  cancel-in-progress: false
jobs:
  closure-and-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run closure, grading & forecast cycle
        working-directory: 1-Full-NodeJS-Server-Edition-24-7
        env:
          CODECRAFT_API_KEY: ${{ secrets.CODECRAFT_API_KEY }}
          XEF_CYCLE_REASON: github-actions
        run: node run-daily-cycle.js
      - name: Commit updated market memory
        run: |
          git config user.name "xau-elite-fonda-engine"
          git config user.email "engine@xau-elite-fonda.local"
          git add 1-Full-NodeJS-Server-Edition-24-7/data/
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Daily closure & forecasts: $(date -u +%Y-%m-%d)"
            git push
          fi
